<div class="auth-container">
  <div class="auth-card">
    <h1>Reset password</h1>

    @if (sent) {
      <p class="auth-success">Check your inbox — we've sent a reset link to {{ form.value.email }}.</p>
    } @else {
      <p class="auth-subtitle">Enter your email and we'll send a reset link.</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
          @if (email.invalid && email.touched) {
            <span class="field-error">Enter a valid email address.</span>
          }
        </div>

        <button type="submit" class="btn btn-primary btn-full" [disabled]="loading">
          {{ loading ? 'Sending…' : 'Send reset link' }}
        </button>
      </form>
    }

    <p class="auth-footer"><a routerLink="/auth/login">Back to sign in</a></p>
  </div>
</div>
