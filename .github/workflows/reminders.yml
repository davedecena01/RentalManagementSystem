name: Send Rent Reminders

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder job
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.API_URL }}/api/reminders/trigger" \
            -H "X-Internal-Key: ${{ secrets.INTERNAL_API_KEY }}" \
            -H "Content-Type: application/json")
          echo "Response status: $response"
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Reminder trigger failed with status $response"
            exit 1
          fi
          echo "Reminders triggered successfully"
