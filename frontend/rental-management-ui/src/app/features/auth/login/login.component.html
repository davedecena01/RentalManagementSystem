<div class="auth-container">
  <div class="auth-card">
    <h1>Sign in</h1>
    <p class="auth-subtitle">Rental Property Manager</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" autocomplete="email" />
        @if (email.invalid && email.touched) {
          <span class="field-error">Enter a valid email address.</span>
        }
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password" />
        @if (password.invalid && password.touched) {
          <span class="field-error">Password must be at least 8 characters.</span>
        }
      </div>

      <div class="form-actions">
        <a routerLink="/auth/forgot-password" class="link-subtle">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-full" [disabled]="loading">
        {{ loading ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a routerLink="/auth/register">Register</a>
    </p>
  </div>
</div>
